name: Build APK from 5 records limit spacing ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify exact ZIP file
        run: |
          if [ ! -f "PRINT_BUTTON_REAL_ATTEMPT_COMPILE_FIXED_BUTTONS_DOWN_ONLY_MULTI_RECORDS_A4_FIXED_5_RECORDS_LIMIT_SPACING_FIXED.zip" ]; then
            echo "ERROR: الملف غير موجود بالاسم المطلوب:"
            echo "PRINT_BUTTON_REAL_ATTEMPT_COMPILE_FIXED_BUTTONS_DOWN_ONLY_MULTI_RECORDS_A4_FIXED_5_RECORDS_LIMIT_SPACING_FIXED.zip"
            echo "الملفات الموجودة:"
            ls -lah
            exit 1
          fi

      - name: Unzip exact project file
        run: |
          rm -rf project
          mkdir project
          unzip -q "PRINT_BUTTON_REAL_ATTEMPT_COMPILE_FIXED_BUTTONS_DOWN_ONLY_MULTI_RECORDS_A4_FIXED_5_RECORDS_LIMIT_SPACING_FIXED.zip" -d project

      - name: Find Android project
        id: android_project
        run: |
          PROJECT_DIR="$(find project -name settings.gradle | head -n 1 | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: لم يتم العثور على settings.gradle داخل الملف"
            find project -maxdepth 5 -type f | head -n 100
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: |
          cd "${{ steps.android_project.outputs.project_dir }}"
          gradle clean assembleDebug --no-build-cache

      - name: Rename APK
        run: |
          mkdir -p final-apk
          cp "${{ steps.android_project.outputs.project_dir }}"/app/build/outputs/apk/debug/*.apk "final-apk/sira-mowathaba-5-records-limit-spacing.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-mowathaba-5-records-limit-spacing-apk
          path: final-apk/*.apk
